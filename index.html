<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>团队 2FA 验证码生成器</title>
    <!-- 引入 OTPAuth 库用于计算 TOTP -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/otpauth/9.2.2/otpauth.umd.min.js"></script>
    <style>
        body { font-family: sans-serif; text-align: center; margin-top: 15%; background-color: #f4f4f9; }
        .container { background: white; padding: 40px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); display: inline-block; max-width: 90%; }
        .code { font-size: 56px; font-weight: bold; letter-spacing: 8px; color: #333; margin: 20px 0; }
        .timer { font-size: 16px; color: #888; margin-bottom: 10px; }
        .error { color: #d9534f; font-size: 16px; font-weight: bold; padding: 10px; }
        .debug-info { font-size: 12px; color: #aaa; margin-top: 20px; word-break: break-all; }
    </style>
</head>
<body>

<div class="container">
    <h2>身份验证码</h2>
    <div id="codeDisplay" class="code">------</div>
    <div class="timer" id="timerContainer">刷新倒计时: <span id="timeRemaining">--</span> 秒</div>
    <div id="errorMsg" class="error"></div>
    <div id="debugInfo" class="debug-info"></div>
</div>

<script>
    // 1. 同时兼容读取 ?key= 和 # 后的密钥
    const urlParams = new URLSearchParams(window.location.search);
    let secretKey = urlParams.get('key'); 
    
    // 如果 ?key 没有获取到，尝试获取 # 后面的内容
    if (!secretKey && window.location.hash) {
        secretKey = window.location.hash.substring(1);
    }

    const errorMsgElement = document.getElementById('errorMsg');
    const codeDisplayElement = document.getElementById('codeDisplay');
    const timerContainer = document.getElementById('timerContainer');
    const debugInfoElement = document.getElementById('debugInfo');

    // 检查外部库是否加载成功 (国内有时候 cdnjs 会网络波动)
    if (typeof OTPAuth === 'undefined') {
        errorMsgElement.innerText = "错误：核心依赖库加载失败，请检查网络或刷新页面。";
        timerContainer.style.display = 'none';
    } 
    else if (!secretKey) {
        errorMsgElement.innerText = "错误：未找到密钥！请在网址末尾添加密钥。\n示例: https://wzlvp.ccwu.cc/#你的密钥";
        timerContainer.style.display = 'none';
    } 
    else {
        // 清理密钥中可能带入的空格
        secretKey = secretKey.replace(/\s+/g, '');
        debugInfoElement.innerText = "当前识别到的密钥前4位: " + secretKey.substring(0, 4) + "***";

        try {
            // 2. 初始化 TOTP
            let totp = new OTPAuth.TOTP({
                issuer: 'Team',
                label: '2FA',
                algorithm: 'SHA1',
                digits: 6,
                period: 30,
                secret: secretKey
            });

            // 3. 定义更新逻辑
            function updateCode() {
                try {
                    let code = totp.generate();
                    codeDisplayElement.innerText = code;

                    let epoch = Math.floor(Date.now() / 1000);
                    let remaining = 30 - (epoch % 30);
                    document.getElementById('timeRemaining').innerText = remaining;
                } catch (e) {
                    errorMsgElement.innerText = "验证码生成失败，可能是密钥格式错误 (必须是 Base32 编码)。";
                    codeDisplayElement.innerText = "ERROR";
                    timerContainer.style.display = 'none';
                    console.error(e);
                }
            }

            // 4. 立即执行并定时刷新
            updateCode();
            setInterval(updateCode, 1000);

        } catch (e) {
            errorMsgElement.innerText = "初始化失败：密钥包含非法字符！";
            codeDisplayElement.innerText = "ERROR";
            timerContainer.style.display = 'none';
        }
    }
</script>

</body>
</html>
